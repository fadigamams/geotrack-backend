name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'yam-android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: python3 patch.py
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Icone YAM
        run: |
          for e in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${e%%:*}; s=${e##*:}
            for f in ic_launcher ic_launcher_round; do
              convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Signer APK
        env:
          YAM_KEY_B64: ${{ secrets.YAM_KEY_B64 }}
          YAM_CERT_B64: ${{ secrets.YAM_CERT_B64 }}
        run: |
          echo "$YAM_KEY_B64" | base64 -d > key.pk8
          echo "$YAM_CERT_B64" | base64 -d > cert.der
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --key key.pk8 --cert cert.der --out YAM.apk aligned.apk
          $BT/apksigner verify --print-certs YAM.apk
          rm -f key.pk8 cert.der aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yam-apk
          path: yam-android/YAM.apk
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view yam-apk --repo "${{ github.repository }}" > /dev/null 2>&1 || gh release create yam-apk --repo "${{ github.repository }}" --title "YAM - You and Me" --notes "Derniere version de YAM (APK Android)."
          gh release upload yam-apk YAM.apk --clobber --repo "${{ github.repository }}"
